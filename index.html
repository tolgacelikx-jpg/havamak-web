<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one shared template, brand swaps only accent + copy. Header, sectioned bands, max 1120px content column. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #56636f;
  --line: #d3d9de;
  --accent: #2064a7;
  --logo-plate: transparent;
  --accent-ink: #ffffff;
  --accent-soft: #dfe9f5;
  --gauge: #c98a00;
  --band: #14202b;
  --band-ink: #e9eef2;
  --band-muted: #9aa8b4;
  --draft: #fff4d6;
  --draft-ink: #5c4300;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-brand="eurorotor"] { --accent: #094c90; --accent-soft: #dde7f3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #17212a; --ink: #e6ebef; --muted: #9aa7b2; --line: #2a3742;
    --accent: #6fa6e6; --accent-ink: #0b1218; --accent-soft: #1c2f45; --gauge: #e3ad3a;
    --band: #0a1015; --band-ink: #e6ebef; --band-muted: #8796a3;
    --draft: #3a2f12; --draft-ink: #f3dc9c; --logo-plate: #ffffff; color-scheme: dark;
  }
  :root[data-brand="eurorotor"]:not([data-theme="light"]) { --accent: #7fb0e8; --accent-soft: #1a2c44; }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #17212a; --ink: #e6ebef; --muted: #9aa7b2; --line: #2a3742;
  --accent: #6fa6e6; --accent-ink: #0b1218; --accent-soft: #1c2f45; --gauge: #e3ad3a;
  --band: #0a1015; --band-ink: #e6ebef; --band-muted: #8796a3;
  --draft: #3a2f12; --draft-ink: #f3dc9c; --logo-plate: #ffffff; color-scheme: dark;
}
:root[data-theme="dark"][data-brand="eurorotor"] { --accent: #7fb0e8; --accent-soft: #1a2c44; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--draft); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(2.5rem, 6vw, 4.25rem); text-transform: uppercase; }
h2 { font-size: clamp(1.75rem, 3.5vw, 2.5rem); text-transform: uppercase; }
h3 { font-size: 1.5rem; }
p { margin: 0; max-width: 65ch; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 .78rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--gauge); outline-offset: 2px; }

/* draft bar (preview chrome, not part of the site) */
.draftbar { background: var(--draft); color: var(--draft-ink); font-size: .85rem; }
.draftbar .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 8px; }
.switch { display: inline-flex; border: 1px solid currentColor; border-radius: 999px; overflow: hidden; }
.switch button { font: 600 .8rem/1 var(--body); padding: 7px 14px; border: 0; background: transparent; color: inherit; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--draft-ink); color: var(--draft); }

/* header */
header.site { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 14px; }
.logo { display: flex; align-items: center; text-decoration: none; }
.logo img { display: block; height: 44px; width: auto; max-width: 100%; background: var(--logo-plate); padding: 4px 8px; border-radius: 6px; }
nav.main { display: flex; flex-wrap: wrap; gap: 4px; }
nav.main a { text-decoration: none; color: var(--ink); font-weight: 500; padding: 6px 12px; border-radius: 6px; }
nav.main a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav.main a:hover { color: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 1rem/1 var(--body); padding: 13px 20px; border-radius: 6px; text-decoration: none; border: 2px solid var(--accent); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }

section { padding-block: 56px; }
section + section { border-top: 1px solid var(--line); }
.stack { display: grid; gap: 20px; }

/* hero */
.hero { padding-block: 64px 48px; }
.hero .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.hero p.lead { font-size: 1.15rem; color: var(--muted); }
.since { font: 700 1rem/1 var(--display); letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }

/* power range chart */
.range { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; }
.range .rr { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 12px; align-items: center; }
.range .lbl { font: 600 1.05rem/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.track { position: relative; height: 22px; background: var(--bg); border-radius: 4px; }
.bar { position: absolute; top: 3px; bottom: 3px; background: var(--accent); border-radius: 3px; }
.bar span { position: absolute; top: 50%; transform: translateY(-50%); font: 500 .7rem/1 var(--mono); color: var(--muted); white-space: nowrap; }
.bar .lo { right: calc(100% + 6px); }
.bar .hi { left: calc(100% + 6px); }
.axis { position: relative; height: 18px; margin-left: calc(6.5rem + 12px); border-top: 1px solid var(--line); }
.axis span { position: absolute; top: 4px; transform: translateX(-50%); font: 500 .7rem/1 var(--mono); color: var(--muted); }
.axis span::before { content: ""; position: absolute; left: 50%; top: -9px; height: 5px; border-left: 1px solid var(--gauge); }
.range .cap { font-size: .8rem; color: var(--muted); }

/* series cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 12px; align-content: start; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card .meta { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.card .meta .mono { color: var(--ink); }
.card p { font-size: .95rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag { display: inline-block; font: 600 .7rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

/* facts band */
.band { background: var(--band); color: var(--band-ink); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.fact b { display: block; font: 700 2.4rem/1 var(--display); color: var(--band-ink); }
.fact span { font-size: .9rem; color: var(--band-muted); }

/* series page */
.crumbs { font-size: .85rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.series-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.photo { aspect-ratio: 4 / 3; max-width: 100%; border: 1px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .85rem; padding: 16px; background: var(--surface); }
.subtitle { font-size: 1.15rem; font-weight: 500; color: var(--accent); }
.bullets { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.pending { border: 1px dashed var(--gauge); background: var(--draft); color: var(--draft-ink); border-radius: 8px; padding: 14px 16px; font-size: .9rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .95rem; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 .75rem/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
td a.ask { font-weight: 600; font-size: .85rem; }

/* contact */
.contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 32px; }
.info { display: grid; gap: 18px; }
.info div { display: grid; gap: 2px; }
.info strong { font-size: 1.1rem; user-select: all; }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-weight: 500; font-size: .9rem; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
.note { font-size: .85rem; color: var(--muted); }

footer { background: var(--band); color: var(--band-muted); font-size: .9rem; }
footer .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-block: 40px; }
footer b { color: var(--band-ink); display: block; margin-bottom: 6px; }
footer a { color: var(--band-ink); }

@media (max-width: 820px) {
  .hero .grid, .series-head, .contact, footer .wrap { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: left .4s ease, width .4s ease; }
}
</style>
</head>

ör serisidir. Tüm paketler ihtiyacınıza göre özelleştirilebilir. Yüksek verimli yeni nesil vida bloğu, IE4 – IE3 verimlilik sınıfı elektrik motoru, kolay bakım ve uzun ömür.", "text_en": "EURO ROTOR ALPHA Series screw air compressors are a complete range of oil-lubricated industrial air compressors suitable for any industry and application. All packages can be customised to suit your needs. High-efficiency new generation airends, IE4 – IE3 efficient electric motors, easy maintenance and long service life."}, {"name": "Magnet", "category": "Kompresör", "count": 20, "text_tr": "HAVAMAK MAGNET serisi sabit mıknatıslı (PM) motorlu, değişken hızlı (VSD) vidalı kompresörler. Hava üretimi tüketiminize göre ayarlanır, enerji maliyetini düşürür. Yüksek verimli yeni nesil vida bloğu, kolay bakım ve uzun ömür. Tüm paketler ihtiyacınıza göre özelleştirilebilir.", "text_en": "EURO ROTOR MAGNET Series variable speed (VSD) screw air compressors with permanent magnet (PM) motor. Air output follows your demand, cutting energy costs. High-efficiency new generation airends, easy maintenance and long service life. All packages can be customised to suit your needs."}, {"name": "Double Stage", "category": "Kompresör", "count": 13, "text_tr": "HAVAMAK DOUBLE STAGE serisi iki kademeli, değişken hızlı (VSD) vidalı kompresörler. İki kademeli sıkıştırma ile kW başına daha fazla hava, sürekli çalışmada yüksek verim. Kolay bakım ve uzun ömür. Tüm paketler ihtiyacınıza göre özelleştirilebilir.", "text_en": "EURO ROTOR DOUBLE STAGE Series two-stage variable speed (VSD) screw air compressors. Two-stage compression delivers more air per kW for efficient continuous operation. Easy maintenance and long service life. All packages can be customised to suit your needs."}, {"name": "Gamma", "category": "Kompresör", "count": 13, "text_tr": "HAVAMAK GAMMA serisi endüstriyel kullanım için değişken hızlı (VSD) vidalı kompresörler. Yüksek verimli yeni nesil vida bloğu, kolay bakım ve uzun ömür. Tüm paketler ihtiyacınıza göre özelleştirilebilir.", "text_en": "EURO ROTOR GAMMA Series variable speed (VSD) screw air compressors for industrial applications. High-efficiency new generation airends, easy maintenance and long service life. All packages can be customised to suit your needs."}, {"name": "DRY", "category": "Hava kurutucu", "count": 19, "text_tr": "Soğutmalı hava kurutucular, basınçlı hava hattındaki su ve yağ buharını tutarak üretiminizi korur. 0,5 ppm ve 1 mikron filtreler dahil, tüm ekipmanı içinde kompakt gövde, etkin hava-yağ-su ayrıştırma, ortam sıcaklığına ve mevsime göre soğutmayı ayarlayan mikroişlemcili kontrol, çevre dostu.", "text_en": "Refrigerated air dryers protect your production from water and oil vapour in the compressed air system. 0.5 ppm and 1 micron filters included, compact footprint with all components installed, efficient air-oil-water separation, microchip-controlled cooling that adapts to ambient temperature and seasonal changes, environmentally friendly."}]};

// 132 kW ve 160 kW modellerde HP değeri seriler arasında çelişiyor (175/180, 215/220); teyit gelene kadar gösterilmez.
const HP_UNCONFIRMED_KW = [132, 160];
const hpOf = m => HP_UNCONFIRMED_KW.includes(m.kw) ? null : m.hp;

const slug = s => s.toLowerCase().replace(/\s+/g, "-");
const SERIES = DATA.series.map(s => ({ ...s, slug: slug(s.name), models: DATA.models.filter(m => m.series === s.name) }));
const fmt = (n, lang) => n == null ? "–" : String(n).replace(".", lang === "tr" ? "," : ".");
const shortName = (m, lang) => (lang === "tr" ? m.name_tr : m.name_en).split(" - ")[0].replace(/ Plakal.*| Plate.*/, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let brand = "havamak", page = "home", filter = "all", preModel = "";

function go(p, opts = {}) {
  page = p;
  if (opts.model !== undefined) preModel = opts.model;
  try { history.replaceState(null, "", "#" + brand + "-" + p); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}

function setBrand(b) {
  brand = b;
  document.documentElement.dataset.brand = b;
  try { localStorage.setItem("brand", b); } catch (e) {}
  go(page);
}

function rangeChart(t) {
  const lo = Math.log(5), hi = Math.log(420);
  const pos = v => ((Math.log(v) - lo) / (hi - lo)) * 100;
  const rows = SERIES.filter(s => s.models.some(m => m.kw)).map(s => {
    const kws = s.models.map(m => m.kw).filter(Boolean);
    const a = Math.min(...kws), b = Math.max(...kws);
    return `<div class="rr"><span class="lbl">${esc(s.name)}</span><div class="track"><div class="bar" style="left:${pos(a)}%;width:${pos(b) - pos(a)}%"><span class="lo">${fmt(a, t.lang)}</span><span class="hi">${fmt(b, t.lang)}</span></div></div></div>`;
  }).join("");
  const ticks = [10, 30, 100, 300].map(v => `<span style="left:${pos(v)}%">${v}</span>`).join("");
  return `<div class="range" aria-label="${esc(t.rangeTitle)}"><div class="eyebrow">${esc(t.rangeTitle)}</div>${rows}<div class="axis">${ticks}</div><div class="cap">${esc(t.rangeCap)}</div></div>`;
}

function seriesCard(s, t) {
  const text = t.lang === "tr" ? s.text_tr : s.text_en;
  const kws = s.models.map(m => m.kw).filter(Boolean);
  const range = kws.length ? `<span><span class="mono">${fmt(Math.min(...kws), t.lang)}–${fmt(Math.max(...kws), t.lang)}</span> kW</span>` : "";
  const drives = [...new Set(s.models.map(m => m.drive).filter(Boolean))].map(d => t.drive[d]).join(", ");
  return `<a class="card" href="#${brand}-${s.slug}" data-go="${s.slug}">
    <span><span class="tag">${esc(t.cat[s.category])}</span></span>
    <h3>${esc(s.name)}</h3>
    <div class="meta"><span><span class="mono">${s.models.length}</span> ${t.models}</span>${range}${drives ? `<span>${esc(drives)}</span>` : ""}</div>
    <p>${esc(text)}</p>
  </a>`;
}

function pHome(t) {
  const facts = t.facts.map(([k, l]) => `<div class="fact"><b>${k === "MODELS" ? DATA.models.length : k}</b><span>${esc(l)}</span></div>`).join("");
  return `
  <section class="hero"><div class="wrap grid">
    <div class="stack">
      <span class="since">${esc(t.since)}</span>
      <h1>${esc(t.h1)}</h1>
      <p class="lead">${esc(t.lead)}</p>
      <div class="row"><a class="btn primary" href="#" data-go="products">${esc(t.ctaProducts)}</a><a class="btn ghost" href="#" data-go="contact">${esc(t.ctaContact)}</a></div>
    </div>
    ${rangeChart(t)}
  </div></section>
  <section class="band"><div class="wrap facts">${facts}</div></section>
  <section><div class="wrap stack">
    <span class="eyebrow">${esc(t.seriesEyebrow)}</span>
    <h2>${esc(t.seriesTitle)}</h2>
    <div class="cards">${SERIES.map(s => seriesCard(s, t)).join("")}</div>
  </div></section>`;
}

function pProducts(t) {
  const cats = ["all", "Kompresör", "Hava kurutucu"];
  const btns = cats.map(c => `<button type="button" class="btn ${filter === c ? "primary" : "ghost"}" data-filter="${c}">${esc(t.filters[c])}</button>`).join("");
  const list = SERIES.filter(s => filter === "all" || s.category === filter);
  return `<section><div class="wrap stack">
    <h1>${esc(t.productsTitle)}</h1>
    <p class="lead">${esc(t.productsLead)}</p>
    <div class="row">${btns}</div>
    <div class="cards">${list.map(s => seriesCard(s, t)).join("")}</div>
  </div></section>`;
}

function pSeries(s, t) {
  const text = t.lang === "tr" ? s.text_tr : s.text_en;
  const isDryer = s.category === "Hava kurutucu";
  const pt = PAGE_TEXT[s.name][t.lang];
  const kws = s.models.map(m => m.kw).filter(Boolean);
  const range = kws.length ? `${s.models.length} ${t.models}, ${fmt(Math.min(...kws), t.lang)}–${fmt(Math.max(...kws), t.lang)} kW` : `${s.models.length} ${t.models}`;
  const head = isDryer
    ? `<th>${t.th.model}</th><th>${t.th.code}</th><th class="num">${t.th.service}</th><th></th>`
    : `<th>${t.th.model}</th><th class="num">${t.th.kw}</th><th class="num">${t.th.hp}</th><th>${t.th.drive}</th><th class="num">${t.th.service}</th><th></th>`;
  const rows = s.models.map(m => {
    const name = shortName(m, t.lang);
    const ask = `<td><a class="ask" href="#" data-go="contact" data-model="${esc(m.code)}">${esc(t.ask)}</a></td>`;
    return isDryer
      ? `<tr><td>${esc(name)}</td><td class="mono">${esc(m.code)}</td><td class="num">${m.service_months} ${t.months}</td>${ask}</tr>`
      : `<tr><td>${esc(name)}</td><td class="num">${fmt(m.kw, t.lang)}</td><td class="num">${fmt(hpOf(m), t.lang)}</td><td>${esc(t.drive[m.drive] || "–")}</td><td class="num">${m.service_months} ${t.months}</td>${ask}</tr>`;
  }).join("");
  return `<section><div class="wrap stack">
    <div class="crumbs"><a href="#" data-go="products">${esc(t.nav.products)}</a> / ${esc(s.name)}</div>
    <div class="series-head">
      <div class="stack">
        <span><span class="tag">${esc(t.cat[s.category])}</span></span>
        <h1>${esc(s.name)}</h1>
        <p class="subtitle">${esc(pt.sub)}</p>
        <p>${esc(text)}</p>
        <ul class="bullets">${range ? `<li>${range}</li>` : ""}${pt.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      </div>
      <div class="photo">${esc(t.photoPending)}</div>
    </div>
    <h2>${esc(t.allModels)} <span class="mono" style="font-size:.6em;color:var(--muted)">${s.models.length}</span></h2>
    <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">${esc(t.specsPending)}</p>
  </div></section>`;
}

function pAbout(t) {
  return `<section><div class="wrap stack">
    <span class="since">${esc(t.since)}</span>
    <h1>${esc(t.aboutTitle)}</h1>
    ${t.about.map(p => `<p class="lead">${esc(p)}</p>`).join("")}
    <div class="pending">${esc(t.aboutPending)}</div>
  </div></section>`;
}

function pContact(t) {
  const opts = DATA.models.map(m => `<option value="${esc(m.code)}"${m.code === preModel ? " selected" : ""}>${esc(shortName(m, t.lang))}</option>`).join("");
  return `<section><div class="wrap stack">
    <h1>${esc(t.contactTitle)}</h1>
    <p class="lead">${esc(t.contactLead)}</p>
    <div class="contact">
      <div class="info">
        <div><span class="eyebrow">${t.lAddr}</span><strong>${esc(t.lang === "tr" ? CONTACT.addr_tr : CONTACT.addr_en)}</strong></div>
        <div><span class="eyebrow">${t.lTel}</span><strong class="mono">${t.lang === "tr" ? CONTACT.tel : CONTACT.tel_intl}</strong></div>
        <div><span class="eyebrow">${t.lWa}</span><strong class="mono">${t.lang === "tr" ? CONTACT.wa : CONTACT.wa_intl}</strong></div>
      </div>
      <form id="cform">
        <label for="f-name">${t.form.name}<input id="f-name" name="name" required></label>
        <label for="f-company">${t.form.company}<input id="f-company" name="company"></label>
        <div class="row" style="flex-wrap:wrap"><label for="f-phone" style="flex:1 1 200px">${t.form.phone}<input id="f-phone" name="phone" type="tel"></label><label for="f-email" style="flex:1 1 200px">${t.form.email}<input id="f-email" name="email" type="email"></label></div>
        <label for="f-model">${t.form.model}<select id="f-model" name="model"><option value="">${t.form.none}</option>${opts}</select></label>
        <label for="f-msg">${t.form.msg}<textarea id="f-msg" name="msg"></textarea></label>
        <div class="row" style="align-items:center"><button class="btn primary" type="submit">${t.form.send}</button><span class="note" id="f-note">${esc(t.formNote)}</span></div>
      </form>
    </div>
  </div></section>`;
}

function render() {
  const t = BRANDS[brand];
  document.documentElement.lang = t.lang;
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", b.dataset.brand === brand));
  document.getElementById("logo").innerHTML = `<img src="${LOGOS[brand]}" alt="${t.logo.join("")} ${esc(t.sub)}">`;
  const s = SERIES.find(x => x.slug === page);
  const navKey = s ? "products" : page;
  document.getElementById("nav").innerHTML = Object.entries(t.nav).map(([k, l]) => `<a href="#${brand}-${k}" data-go="${k}"${k === navKey ? ' aria-current="page"' : ""}>${esc(l)}</a>`).join("");
  const main = document.getElementById("main");
  main.innerHTML = s ? pSeries(s, t) : page === "products" ? pProducts(t) : page === "about" ? pAbout(t) : page === "contact" ? pContact(t) : pHome(t);
  document.getElementById("footer").innerHTML = `<div class="wrap">
    <div><b>${t.logo.join("")}</b>${esc(t.footerAbout)}</div>
    <div><b>${t.lAddr}</b>${esc(t.lang === "tr" ? CONTACT.addr_tr : CONTACT.addr_en)}</div>
    <div><b>${t.lTel} · ${t.lWa}</b><span class="mono">${t.lang === "tr" ? CONTACT.tel : CONTACT.tel_intl}</span><br><span class="mono">${t.lang === "tr" ? CONTACT.wa : CONTACT.wa_intl}</span></div>
  </div>`;
  const form = document.getElementById("cform");
  if (form) form.addEventListener("submit", e => { e.preventDefault(); document.getElementById("f-note").textContent = t.formDone; });
}

document.addEventListener("click", e => {
  const sw = e.target.closest(".switch button");
  if (sw) return setBrand(sw.dataset.brand);
  const f = e.target.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; return render(); }
  const a = e.target.closest("[data-go]");
  if (a) { e.preventDefault(); go(a.dataset.go, { model: a.dataset.model || "" }); }
});

(function init() {
  const h = (location.hash || "").slice(1);
  const m = h.match(/^(havamak|eurorotor)-(.+)$/);
  let b = null;
  try { b = localStorage.getItem("brand"); } catch (e) {}
  if (m) { brand = m[1]; page = m[2]; } else if (b === "eurorotor") brand = b;
  document.documentElement.dataset.brand = brand;
  render();
})();
</script>

</body>
</html>
